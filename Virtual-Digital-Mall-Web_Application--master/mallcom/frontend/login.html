<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mallcom - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: url('https://i.pinimg.com/564x/40/b4/05/40b4054ddd4187fcba75da094c8db6f5.jpg') no-repeat center center/cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            height: 60px;
            width: 100%;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 1rem;
            position: fixed;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .navbar-menu {
            list-style: none;
            display: flex;
            gap: 60px;
        }
        .navbar-menu a {
            color: #000;
            text-decoration: none;
            padding: 0.4em 0.8em;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .navbar-menu a:hover {
            background-color: rgba(0,0,0,0.1);
            border-radius: 5px;
        }

        .page-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 80px;
            padding-bottom: 40px;
        }

        .auth-card {
            background: rgba(255,255,255,0.97);
            border-radius: 12px;
            padding: 40px 48px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
        }

        .auth-card h2 {
            font-size: 26px;
            margin-bottom: 6px;
            color: #111;
        }
        .auth-card .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.2s;
            outline: none;
        }
        input:focus { border-color: #000; }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }
        .btn-primary:hover { background-color: #333; }
        .btn-primary:disabled { background-color: #888; cursor: not-allowed; }

        .alt-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }
        .alt-link a { color: #000; font-weight: bold; text-decoration: none; }
        .alt-link a:hover { text-decoration: underline; }

        .alert {
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .alert-error   { background: #ffeaea; color: #c0392b; border: 1px solid #e74c3c; }
        .alert-success { background: #eaffea; color: #27ae60; border: 1px solid #2ecc71; }

        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<nav class="navbar">
    <ul class="navbar-menu">
        <li><a href="Minor_project.html">Home</a></li>
        <li><a href="brands.html">Brands</a></li>
        <li><a href="luxery.html">Luxury</a></li>
        <li><a href="Explore_Brands.html">Featured Stores</a></li>
        <li><a href="search.html">Search</a></li>
    </ul>
</nav>

<div class="page-wrapper">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your Mallcom account</p>

        <div class="alert alert-error"   id="errorAlert"></div>
        <div class="alert alert-success" id="successAlert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
        </form>

        <p class="alt-link">
            Don't have an account? <a href="register.html">Create one</a>
        </p>
    </div>
</div>

<script src="js/auth.js"></script>
<script>
    const API_BASE = 'http://localhost:8080/api/auth';

    // If a real session already exists, skip the login form entirely.
    (async () => {
        const user = await MallcomAuth.getCurrentUser();
        if (user) {
            window.location.href = user.role === 'ADMIN' ? 'admin-dashboard.html' : 'Minor_project.html';
        }
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn          = document.getElementById('loginBtn');
        const errorAlert   = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');

        errorAlert.style.display   = 'none';
        successAlert.style.display = 'none';

        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        btn.disabled  = true;
        btn.innerHTML = '<span class="spinner"></span> Signing in...';

        try {
            // Spring Security's form-login filter intercepts this exact URL and reads
            // request.getParameter(), so the body must be form-urlencoded (not JSON),
            // with the field names configured in SecurityConfig (username/password).
            // credentials: 'include' is required so the session cookie is stored.
            const res  = await fetch(`${API_BASE}/login`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                credentials: 'include',
                body: new URLSearchParams({ username: email, password: password })
            });
            const data = await res.json();

            if (res.ok && data.success) {
                const user = data.data; // {id, fullName, email, role} - auth itself is the session cookie

                successAlert.textContent  = `Welcome back, ${user.fullName}! Redirecting...`;
                successAlert.style.display = 'block';

                const destination = user.role === 'ADMIN' ? 'admin-dashboard.html' : 'Minor_project.html';
                setTimeout(() => window.location.href = destination, 1200);
            } else {
                errorAlert.textContent  = data.message || 'Login failed. Please check your credentials.';
                errorAlert.style.display = 'block';
                btn.disabled  = false;
                btn.textContent = 'Sign In';
            }
        } catch (err) {
            errorAlert.textContent  = 'Cannot connect to server. Make sure the backend is running on port 8080.';
            errorAlert.style.display = 'block';
            btn.disabled  = false;
            btn.textContent = 'Sign In';
        }
    });
</script>
</body>
</html>
